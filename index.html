<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="JavaScript Learning — From Beginner to Professional by Akshay Admane."
  >

  <meta name="theme-color" content="#050505">

  <title>JavaScript — From Beginner to Professional</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="landing">

    <div class="background-grid"></div>

    <section class="content">

      <!-- Terminal -->
      <div class="terminal">
        <span class="terminal-symbol">$</span>
        <span id="typing"></span>
        <span class="cursor">_</span>
      </div>

      <!-- Main branding -->
      <div class="brand">

        <div class="eyebrow">
          A Structured Learning Journey
        </div>

        <h1>
          JAVASCRIPT
        </h1>

        <h2>
          FROM BEGINNER<br>
          TO PROFESSIONAL
        </h2>

        <p class="author">
          by <strong>Akshay Admane</strong>
        </p>

      </div>

      <!-- Short loading animation -->
      <div class="progress-container">

        <div class="progress-bar">
          <span></span>
        </div>

        <p id="status">
          Preparing your learning journey...
        </p>

      </div>

      <!-- Manual navigation -->
      <a
        id="courseLink"
        class="course-button"
        href="https://github.com/akshay-admane/Professional-Javascript"
      >
        START LEARNING
        <span>→</span>
      </a>

    </section>


    <!-- Bottom message -->
    <footer>

      <span>LEARN</span>
      <span>BUILD</span>
      <span>DEBUG</span>
      <span>THINK LIKE AN ENGINEER</span>

    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
