<!DOCTYPE html>
<html lang="en">
<head>

    name="viewport"

  >

  <meta
    name="description"
    content="JavaScript Learning — From Beginner to Professional by Akshay Admane."

        </h1>

    <footer>

      <span>LEARN</span>
