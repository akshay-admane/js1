<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="JavaScript Learning — From Beginner to Professional by Akshay Admane."
  />

  <meta
    name="theme-color"
    content="#050505"
  />

  <title>JavaScript — From Beginner to Professional</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="intro">

    <!-- Animated background grid -->
    <div class="grid"></div>

    <section class="content">

      <!-- Terminal animation -->
      <div class="terminal-line">
        <span class="prompt">$</span>
        <span id="typing"></span>
        <span class="cursor">_</span>
      </div>


      <!-- Course branding -->
      <div class="brand">

        <p class="eyebrow">
          A structured learning journey
        </p>

        <h1>
          JAVASCRIPT
        </h1>

        <h2>
          FROM BEGINNER<br />
          TO PROFESSIONAL
        </h2>

        <p class="author">
          by <strong>Akshay Admane</strong>
        </p>

      </div>


      <!-- Loading / status -->
      <div class="loading">

        <div class="loading-bar">
          <span></span>
        </div>

        <p id="status">
          Initializing your course...
        </p>

      </div>


      <!-- User must click this -->
      <a
        class="open-course"
        href="https://github.com/akshay-admane/Professional-Javascript"
        id="courseLink"
      >
        Open Course →
      </a>

    </section>


    <!-- Bottom branding -->
    <footer>

      <span>LEARN</span>

      <span>BUILD</span>

      <span>DEBUG</span>

      <span>THINK LIKE AN ENGINEER</span>

    </footer>

  </main>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
